version: 2

models:

  - name: dim_customers
    description: "Customer dimension — one row per unique customer derived from Orders source."
    columns:
      - name: customer_key
        description: "Surrogate key (MD5 hash of customer_id)."
        tests:
          - unique
          - not_null
      - name: customer_id
        description: "Natural customer identifier from source."
        tests:
          - not_null
      - name: customer_name
        description: "Full name of the customer."
        tests:
          - not_null
      - name: segment
        description: "Customer segment: Consumer, Corporate, or Home Office."
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['Consumer', 'Corporate', 'Home Office']

  - name: dim_products
    description: "Product dimension — one row per unique product."
    columns:
      - name: product_key
        description: "Surrogate key (MD5 hash of product_id)."
        tests:
          - unique
          - not_null
      - name: product_id
        description: "Natural product identifier from source."
        tests:
          - not_null
      - name: product_name
        description: "Full product name."
        tests:
          - not_null
      - name: category
        description: "High-level product category."
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['Furniture', 'Office Supplies', 'Technology']
      - name: sub_category
        description: "Product sub-category within the category."
        tests:
          - not_null

  - name: dim_geography
    description: "Geography dimension — one row per unique city/state/country/postal_code combination."
    columns:
      - name: geography_key
        description: "Surrogate key (MD5 hash of country|city|state|postal_code)."
        tests:
          - unique
          - not_null
      - name: country
        tests:
          - not_null
      - name: city
        tests:
          - not_null
      - name: state
        tests:
          - not_null
      - name: region
        description: "Sales region: East, West, Central, South."
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['East', 'West', 'Central', 'South']

  - name: dim_dates
    description: "Date dimension — one row per unique date present in order_date or ship_date."
    columns:
      - name: date_key
        description: "Integer date key in YYYYMMDD format."
        tests:
          - unique
          - not_null
      - name: full_date
        description: "The actual calendar date."
        tests:
          - not_null
      - name: year
        tests:
          - not_null
      - name: quarter
        tests:
          - not_null
      - name: month
        tests:
          - not_null
      - name: day_of_week
        tests:
          - not_null

  - name: fct_orders
    description: >
      Order fact table — one row per order line item.
      Contains all measures (sales, profit, quantity, discount)
      and FK references to all four dimension tables.
    tests:
      - elementary.volume_anomalies:
          tags: ['elementary']
          arguments:
            timestamp_column: order_date
            time_bucket:
              period: day
              count: 1
            days_back: 90
            backfill_days: 2
            anomaly_sensitivity: 3
    columns:
      - name: order_line_id
        description: "Natural row-level identifier from source (Row ID)."
        tests:
          - unique
          - not_null
      - name: order_id
        description: "Order identifier — multiple rows share the same order_id."
        tests:
          - not_null
      - name: customer_key
        description: "FK → dim_customers.customer_key"
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_customers')
                field: customer_key
      - name: product_key
        description: "FK → dim_products.product_key"
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_products')
                field: product_key
      - name: geography_key
        description: "FK → dim_geography.geography_key"
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_geography')
                field: geography_key
      - name: order_date_key
        description: "FK → dim_dates.date_key for the order date."
        tests:
          - not_null
      - name: ship_date_key
        description: "FK → dim_dates.date_key for the ship date."
        tests:
          - not_null
      - name: order_date
        description: "Order date as a DATE — used by elementary volume_anomalies."
        tests:
          - not_null
      - name: ship_date
        description: "Ship date as a DATE."
        tests:
          - not_null
      - name: sales
        description: "Gross sales amount for the line item."
        tests:
          - not_null
      - name: quantity
        description: "Number of units ordered."
        tests:
          - not_null
      - name: discount
        description: "Discount rate applied (0.0 – 1.0)."
        tests:
          - not_null
      - name: profit
        description: "Profit for the line item (can be negative)."
        tests:
          - not_null
      - name: is_returned
        description: "TRUE if the order was returned."
        tests:
          - not_null

  - name: fct_earthquakes
    description: >
      One row per USGS earthquake event, fed by a live daily ingest
      (ingest/usgs_earthquakes.py). Provides a real, growing time series so
      Elementary's volume_anomalies test has a baseline to detect deviations.
    tests:
      - elementary.volume_anomalies:
          tags: ['elementary']
          arguments:
            timestamp_column: event_time
            # Only score complete daily buckets; the current day is still being
            # ingested and its partial volume would read as a false-positive drop.
            where_expression: "event_time < timestamp_trunc(current_timestamp(), day)"
            time_bucket:
              period: day
              count: 1
            days_back: 90
            backfill_days: 2
            anomaly_sensitivity: 3
    columns:
      - name: earthquake_key
        description: "Surrogate key (MD5 hash of the USGS event id)."
        tests:
          - unique
          - not_null
      - name: id
        description: "USGS natural event id."
        tests:
          - not_null
      - name: event_time
        description: "Event origin time (UTC) — used by elementary volume_anomalies."
        tests:
          - not_null
