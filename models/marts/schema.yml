version: 2

models:

  - name: fct_earthquakes
    description: >
      One row per USGS earthquake event, fed by a live daily ingest
      (ingest/usgs_earthquakes.py). Provides a real, growing time series so
      Elementary's volume_anomalies test has a baseline to detect deviations.
    tests:
      - elementary.volume_anomalies:
          tags: ['elementary']
          arguments:
            timestamp_column: event_time
            # Only score complete daily buckets; the current day is still being
            # ingested and its partial volume would read as a false-positive drop.
            where_expression: "event_time < timestamp_trunc(current_timestamp(), day)"
            time_bucket:
              period: day
              count: 1
            days_back: 90
            backfill_days: 2
            anomaly_sensitivity: 3
    columns:
      - name: earthquake_key
        description: "Surrogate key (MD5 hash of the USGS event id)."
        tests:
          - unique
          - not_null
      - name: id
        description: "USGS natural event id."
        tests:
          - not_null
      - name: event_time
        description: "Event origin time (UTC) — used by elementary volume_anomalies."
        tests:
          - not_null
      - name: magnitude
        description: "Event magnitude (the core scientific quantity); monitored for distribution and data-quality drift."
        tests:
          - elementary.column_anomalies:
              tags: ['elementary']
              # Warn, don't fail: a real earthquake swarm can legitimately move
              # the daily mean magnitude (observed range ~1.3–1.8), so an anomaly
              # here is a signal to investigate, not a reason to break the build.
              config:
                severity: warn
              arguments:
                # Score only genuine data-quality signals: null_count (feed/parse
                # breakage) and average (distribution drift, e.g. a units bug).
                # min/max are deliberately omitted — for an earthquake feed the
                # daily min/max magnitude is driven by real geophysics (one big
                # quake legitimately spikes the day's max), so monitoring them
                # flags real-world volatility as false positives.
                column_anomalies: ['null_count', 'average']
                timestamp_column: event_time
                where_expression: "event_time < timestamp_trunc(current_timestamp(), day)"
                time_bucket:
                  period: day
                  count: 1
                days_back: 90
                backfill_days: 2
                anomaly_sensitivity: 3
      - name: depth_km
        description: "Hypocenter depth in km; monitored for distribution and data-quality drift."
        tests:
          - elementary.column_anomalies:
              tags: ['elementary']
              # Warn, don't fail (same rationale as magnitude).
              config:
                severity: warn
              arguments:
                # Same rationale as magnitude: null_count + average are the
                # data-quality signals; min/max depth swings are real geology.
                column_anomalies: ['null_count', 'average']
                timestamp_column: event_time
                where_expression: "event_time < timestamp_trunc(current_timestamp(), day)"
                time_bucket:
                  period: day
                  count: 1
                days_back: 90
                backfill_days: 2
                anomaly_sensitivity: 3
