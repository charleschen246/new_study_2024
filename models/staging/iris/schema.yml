version: 2

models:
  - name: stg_iris__measurements
    description: "Staged iris measurements — one row per flower observation with cleaned column names."
    columns:
      - name: measurement_id
        description: "Surrogate row identifier."
        tests:
          - unique
          - not_null
      - name: species
        description: "Iris species: setosa, versicolor, or virginica."
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['setosa', 'versicolor', 'virginica']